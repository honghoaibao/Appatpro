name: Apply AT PRO v1.5.0 archive once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-atpro-archive-once.yml

permissions:
  contents: write

jobs:
  apply-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate, extract, and prepare source
        shell: bash
        run: |
          set -euo pipefail
          test -f atpro_v1_5_0.zip
          unzip -t atpro_v1_5_0.zip >/dev/null
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q atpro_v1_5_0.zip -d "$tmp"
          test -d "$tmp/atpro"
          file_count="$(find "$tmp/atpro" -type f | wc -l | tr -d ' ')"
          test "$file_count" = "221"
          rsync -a --exclude='.github/workflows/build.yml' "$tmp/atpro/" ./
          mkdir -p .archive-extracted
          cp "$tmp/atpro/.github/workflows/build.yml" .archive-extracted/build.yml
          test -s android/app/src/main/kotlin/com/atpro/ui/theme/AtTheme.kt
          test -s .claude/context/current_focus.md
          echo "Extracted $file_count files. Build workflow staged separately for the repository API."

      - name: Commit and push extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Apply AT PRO v1.5.0 archive to repository root"
          git push origin HEAD:main
