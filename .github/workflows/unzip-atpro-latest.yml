name: Extract latest AT PRO ZIP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unzip-atpro-latest.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract archive contents into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="atpro_v1_12_0.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from tempfile import TemporaryDirectory
          import shutil

          archive = Path("atpro_v1_12_0.zip")
          repo_root = Path(".").resolve()

          with ZipFile(archive) as z:
              members = [m for m in z.infolist() if m.filename]
              for member in members:
                  name = PurePosixPath(member.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe ZIP path: {member.filename}")

              # The uploaded archive has a wrapper directory named "atpro".
              # Extract that directory's contents directly into the repository root.
              file_paths = [
                  PurePosixPath(m.filename)
                  for m in members
                  if not m.is_dir()
              ]
              has_atpro_wrapper = bool(file_paths) and all(
                  p.parts and p.parts[0] == "atpro" for p in file_paths
              )

              with TemporaryDirectory() as temp_dir:
                  temp_root = Path(temp_dir)
                  z.extractall(temp_root)
                  source_root = temp_root / "atpro" if has_atpro_wrapper else temp_root

                  for child in source_root.iterdir():
                      destination = repo_root / child.name
                      if child.is_dir():
                          shutil.copytree(child, destination, dirs_exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(child, destination)

          # Remove the old wrapper directory created by the earlier extraction.
          old_wrapper = repo_root / "atpro"
          if old_wrapper.is_dir():
              shutil.rmtree(old_wrapper)
          PY

      - name: Commit flattened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No flattened source changes to commit."
          else
            git commit -m "Move AT PRO v1.12.0 source to repository root"
            git push
          fi
