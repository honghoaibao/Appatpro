name: Extract latest AT PRO ZIP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/unzip-atpro-latest.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract latest version archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="atpro_v1_12_0.zip"
          test -f "$ZIP_FILE" || { echo "Missing $ZIP_FILE"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os

          archive = Path("atpro_v1_12_0.zip")
          root = Path(".").resolve()
          with ZipFile(archive) as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
              z.extractall(root)
          PY

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract AT PRO v1.12.0 source"
            git push
          fi
