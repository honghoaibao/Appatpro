name: AT PRO — Build APK

on:
  push:
    branches: [ main, dev, release/* ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vd: 1.3.3)'
        required: true
        default:  '1.3.3'
      build:
        description: 'Build number'
        required: true
        default:  '35'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' && secrets.KEY_ALIAS != '' }}

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # cần full history để tạo changelog

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ── Gradle ─────────────────────────────────────────────────────────────────
    # v1.3.3 [FIX TD-CI-001, lần 2]: Lần fix trước (tự wget + tìm jar trong bản
    # phân phối) khiến `./gradlew assembleRelease` báo
    # "Could not find or load main class" — nghĩa là jar copy thủ công không
    # hợp lệ/không đúng file (glob `gradle-wrapper-*.jar` không đảm bảo khớp
    # đúng 1 file duy nhất, không nên tự đoán cấu trúc nội bộ bản phân phối
    # Gradle theo cách đó).
    #
    # Đổi hướng dứt điểm: dùng action chính thức của Gradle
    # (`gradle/actions/setup-gradle`) để CÀI ĐẶT hẳn 1 bản Gradle 8.3 lên PATH
    # của runner — action này tải/cache bản phân phối qua cơ chế riêng của nó
    # (không qua HEAD-request-validate của task `wrapper` từng gây lỗi ở lần
    # fix đầu), rồi gọi thẳng lệnh `gradle` thay vì `./gradlew`. Đây là cách
    # được chính Gradle khuyến nghị cho project không commit Gradle Wrapper
    # (xem https://github.com/gradle/actions/blob/main/docs/setup-gradle.md,
    # mục "Build with a specific Gradle version"). Không cần `gradle-wrapper.jar`
    # / `chmod +x gradlew` / bước bootstrap tự viết nào nữa — xoá hẳn nhóm vấn
    # đề TD-CI-001, không phải vá thêm.
    #
    # setup-gradle tự cache theo cơ chế riêng (hiệu quả hơn actions/cache thủ
    # công) — vì vậy bước "Cache Gradle" bằng actions/cache@v4 trước đây cũng bị
    # xoá theo khuyến nghị chính thức (dùng cả 2 cùng lúc có thể xung đột cache).
    - name: Setup Gradle 8.3
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '8.3' # Quotes bắt buộc — tránh YAML tự chuyển thành số

    # ── Signing (tuỳ chọn) ─────────────────────────────────────────────────────
    - name: Setup signing (nếu có keystore)
      if: env.HAS_KEYSTORE == 'true'
      env:
        KEYSTORE_BASE64:  ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD:   ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD:     ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS:        ${{ secrets.KEY_ALIAS }}
      run: |
        mkdir -p android/keystore
        echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/atpro-release.jks
        cat > android/key.properties << PROPS
        storePassword=$STORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=$KEY_ALIAS
        storeFile=../keystore/atpro-release.jks
        PROPS
        echo "OK: Release signing configured"

    # ── Version ────────────────────────────────────────────────────────────────
    - name: Determine version
      id: ver
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VER="${{ github.event.inputs.version }}"
          BLD="${{ github.event.inputs.build }}"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          BLD="${{ github.run_number }}"
        else
          # v1.3.0 FIX: trước đây hardcode VER="1.2.9" ở đây — mỗi lần bump version
          # trong build.gradle mà quên sửa dòng này thì build thường (push không
          # kèm tag/không phải workflow_dispatch) vẫn ra APK với version CŨ dù
          # build.gradle đã đúng. Giờ đọc thẳng versionName từ build.gradle để
          # tự động khớp, không cần sửa 2 chỗ mỗi lần release.
          VER=$(grep -oP 'versionName\s+"v\K[^"]+' android/app/build.gradle)
          if [ -z "$VER" ]; then
            echo "WARN: Không đọc được versionName từ build.gradle — fallback 0.0.0"
            VER="0.0.0"
          fi
          BLD="${{ github.run_number }}"
        fi
        echo "version=$VER"  >> $GITHUB_OUTPUT
        echo "build=$BLD"    >> $GITHUB_OUTPUT

    - name: Update version in build.gradle
      run: |
        sed -i "s/versionCode [0-9]*/versionCode ${{ steps.ver.outputs.build }}/" android/app/build.gradle
        sed -i "s/versionName \"v[^\"]*\"/versionName \"v${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
        echo "versionCode → ${{ steps.ver.outputs.build }}"
        echo "versionName → v${{ steps.ver.outputs.version }}"
        grep -E "versionCode|versionName" android/app/build.gradle

    # ── Build ──────────────────────────────────────────────────────────────────
    - name: Build APK
      working-directory: android
      run: gradle assembleRelease --stacktrace --warning-mode all

    - name: Rename APK
      run: |
        mkdir -p dist
        cp android/app/build/outputs/apk/release/app-release.apk dist/atpro.apk
        echo "APK: $(du -sh dist/atpro.apk | cut -f1)"

    # ── Upload artifact ────────────────────────────────────────────────────────
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: atpro-v${{ steps.ver.outputs.version }}-b${{ steps.ver.outputs.build }}
        path: dist/atpro.apk
        retention-days: 30

    # ── Upload problems report (on failure) ────────────────────────────────────
    - name: Upload Gradle problems report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-problems-report
        path: android/build/reports/problems/problems-report.html
        if-no-files-found: ignore
        retention-days: 7

    # ── GitHub Release (chỉ khi push tag) ─────────────────────────────────────

    # Tạo release notes động từ git log giữa tag hiện tại và tag trước
    - name: Generate changelog
      id: changelog
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG="${{ github.ref_name }}"
        PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)

        if [ -n "$PREV_TAG" ]; then
          RANGE="${PREV_TAG}..${TAG}"
          SINCE_LINE="**Thay đổi từ:** \`${PREV_TAG}\`"
        else
          RANGE="HEAD"
          SINCE_LINE="**Release đầu tiên**"
        fi

        COMMITS=$(git log --pretty=format:"- %s (\`%h\`)" ${RANGE} | head -30)
        if [ -z "$COMMITS" ]; then
          COMMITS="- Không có commit mới"
        fi

        cat > /tmp/release_notes.md << NOTES
        ## AT PRO v${{ steps.ver.outputs.version }}

        ${SINCE_LINE}
        **Build:** \`${{ steps.ver.outputs.build }}\` | **Commit:** \`${{ github.sha }}\`

        ### Thay đổi
        ${COMMITS}

        ### Cài đặt
        1. Download \`atpro.apk\` bên dưới
        2. Mở file → cài đặt
        3. Settings → Accessibility → AT PRO Automation → Bật ON
        NOTES

        echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

    # Kiểm tra release cho tag này đã tồn tại chưa — nếu rồi thì bỏ qua
    - name: Check if release already exists
      id: check_release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release ${{ github.ref_name }} already exists — skipping"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Release ${{ github.ref_name }} not found — will create"
        fi

    # Chỉ tạo mới, không bao giờ update release đã có
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') && steps.check_release.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        name: AT PRO v${{ steps.ver.outputs.version }}
        body_path: /tmp/release_notes.md
        files: dist/atpro.apk
        fail_on_unmatched_files: true
        make_latest: true

    # ── Summary ────────────────────────────────────────────────────────────────
    - name: Summary
      run: |
        SIGNED=$([[ -f android/key.properties ]] && echo "Release (keystore)" || echo "Debug (unsigned)")
        RELEASE_STATUS=""
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          if [[ "${{ steps.check_release.outputs.exists }}" == "true" ]]; then
            RELEASE_STATUS="| Release | Skipped (tag already released) |"
          else
            RELEASE_STATUS="| Release | Created: \`${{ github.ref_name }}\` |"
          fi
        fi
        echo "## Build OK" >> $GITHUB_STEP_SUMMARY
        echo "| | |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| APK | \`atpro.apk\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Version | \`${{ steps.ver.outputs.version }}\` (build ${{ steps.ver.outputs.build }}) |" >> $GITHUB_STEP_SUMMARY
        echo "| Signing | $SIGNED |" >> $GITHUB_STEP_SUMMARY
        echo "| Size | $(du -sh dist/atpro.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
        if [ -n "$RELEASE_STATUS" ]; then
          echo "$RELEASE_STATUS" >> $GITHUB_STEP_SUMMARY
        fi
