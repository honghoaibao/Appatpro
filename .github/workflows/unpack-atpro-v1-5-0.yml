name: Apply AT PRO v1.5.0 archive

on:
  push:
    branches:
      - apply-atpro-v1.5.0
    paths:
      - .github/workflows/unpack-atpro-v1-5-0.yml

permissions:
  contents: write

jobs:
  apply-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: apply-atpro-v1.5.0
          persist-credentials: true

      - name: Validate and extract archive at repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f atpro_v1_5_0.zip
          unzip -t atpro_v1_5_0.zip >/dev/null
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q atpro_v1_5_0.zip -d "$tmp"
          test -d "$tmp/atpro"
          file_count="$(find "$tmp/atpro" -type f | wc -l | tr -d ' ')"
          test "$file_count" = "221"
          rsync -a "$tmp/atpro/" ./
          test -s android/app/src/main/kotlin/com/atpro/ui/theme/AtTheme.kt
          test -s .claude/context/current_focus.md
          rm -f .github/workflows/unpack-atpro-v1-5-0.yml
          echo "Extracted $file_count files from atpro_v1_5_0.zip."

      - name: Commit and push extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply AT PRO v1.5.0 archive to repository root"
          git push origin HEAD:apply-atpro-v1.5.0
